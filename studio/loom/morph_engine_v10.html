<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GENTLY // Shell · per-component</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1117;--surf:#161B22;--elev:#21262D;--tx:#E6EDF3;--mut:#8B949E;
    --acc:#58A6FF;--sov:#D2A8FF;--suc:#3FB950;--warn:#D29922;--dan:#F85149;--bd:#30363D;
    --f:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--f);background:#070a0e;color:var(--tx);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
  button,input{font-family:inherit}

  /* outermost shell: BRAND (54) · CONSTRUCT (76) · MAIN (1fr) · FOOT (32) */
  #shell{display:grid;grid-template-rows:54px 76px 1fr 32px;height:100vh}

  /* ===== BRAND row · top ===== */
  #brand{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#11151c,#0d1117);z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.4)}
  #brand .logo{display:flex;flex-direction:column;line-height:1.1}
  #brand .logo b{color:var(--sov);letter-spacing:.5px;font-size:13px}
  #brand .logo span{color:var(--mut);font-size:9px}
  #brand .ctx{padding:2px 9px;border:1px solid var(--bd);border-radius:20px;font-size:10px;color:var(--mut);cursor:pointer;position:relative}
  #brand .ctx:hover{border-color:var(--acc)}
  #brand .ctx b{color:var(--acc)}
  #brand .ctx-lbl{font-size:8px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;margin-right:4px}
  #brand .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:10px;color:var(--mut)}
  #brand .catalog{display:flex;align-items:center;gap:6px}
  #brand .catalog .lbl{font-size:8px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase}
  #brand .catalog .dots{display:flex;gap:4px}
  .reldot{width:8px;height:8px;border-radius:50%;background:var(--suc);box-shadow:0 0 5px var(--suc);cursor:pointer}
  .reldot:hover{transform:scale(1.4)}
  #brand .add-stage{padding:6px 12px;border:1px solid var(--sov);color:var(--sov);border-radius:7px;font-size:10px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
  #brand .add-stage:hover{background:var(--sov);color:var(--bg)}
  /* build dropdown popup */
  .builddrop{position:absolute;top:28px;left:0;background:var(--elev);border:1px solid var(--bd);border-radius:8px;padding:4px;z-index:50;display:none;min-width:140px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
  .builddrop.open{display:block}
  .builddrop .bopt{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:10px;cursor:pointer;border-radius:5px}
  .builddrop .bopt:hover{background:var(--surf)}
  .builddrop .bopt.active{color:var(--sov)}
  .builddrop .bopt .bg{font-size:11px}
  .builddrop .bact{border-top:1px solid var(--bd);padding:4px;margin-top:4px;display:flex;gap:4px}
  .builddrop .bact span{flex:1;padding:5px;border:1px solid var(--bd);border-radius:5px;font-size:9px;text-align:center;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
  .builddrop .bact span:hover{background:var(--surf);color:var(--acc)}

  /* ===== CONSTRUCT ribbon · the persistent compose surface (now merged with chain-cap) ===== */
  #construct{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#0c1016,#0a0d12)}
  #construct .lbl{display:flex;flex-direction:column;gap:1px;line-height:1.1}
  #construct .lbl b{font-size:10px;letter-spacing:1.5px;color:var(--sov);text-transform:uppercase}
  #construct .lbl span{font-size:8px;color:var(--mut)}
  #construct input.cprompt{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;color:var(--tx);font-size:13px;font-family:inherit}
  #construct input.cprompt:focus{outline:none;border-color:var(--acc)}
  #construct .scopes{display:flex;gap:5px;flex-wrap:wrap}
  .schip{display:flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid var(--bd);border-radius:6px;font-size:9.5px;letter-spacing:.4px;color:var(--mut);cursor:pointer;background:transparent;transition:all .14s;user-select:none}
  .schip:hover{border-color:var(--acc);color:var(--tx)}
  .schip.on{border-color:var(--suc);color:var(--suc);background:rgba(63,185,80,.08)}
  .schip .led{width:5px;height:5px;border-radius:50%;background:var(--bd);transition:all .14s}
  .schip.on .led{background:var(--suc);box-shadow:0 0 5px var(--suc)}
  #construct .go{padding:8px 16px;border:1px solid var(--sov);color:var(--sov);border-radius:8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;background:transparent}
  #construct .go:hover{background:var(--sov);color:var(--bg)}

  /* ===== MAIN · CHAIN (hidden when empty) ===== */
  #main{min-height:0;display:flex;flex-direction:column;background:#070a0e}
  #main.empty{display:none}
  #feed{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}

  /* row = card + per-component tab on the right */
  .compRow{display:flex;align-items:flex-start;gap:8px;width:100%}

  /* engine component card (left part of the row) */
  .ecard{flex:1;border:1px solid var(--bd);border-radius:11px;background:linear-gradient(180deg,#0d1117,#0b0e13);overflow:hidden;transition:border-color .2s;min-width:0}
  .ecard.open{border-color:var(--sov)}
  .ehead{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none}
  .ehead:hover{background:var(--elev)}
  .ehead .chev{color:var(--sov);width:12px;font-weight:700;transition:transform .2s;font-size:12px}
  .ecard:not(.open) .ehead .chev{transform:rotate(180deg)}
  .ehead .g{width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--bd);border-radius:6px;font-size:13px;flex:0 0 24px}
  .ecard.open .ehead .g{border-color:var(--sov);color:var(--sov)}
  .ehead .nm{font-weight:700;letter-spacing:.3px;font-size:13px}
  .ehead .sub{font-size:9px;color:var(--mut)}
  .ehead .summ{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:9px;color:var(--mut)}
  .ehead .thumb{width:30px;height:8px;border-radius:3px}
  .ehead .sig{color:var(--acc)}
  .ehead .del{color:var(--mut);border:1px solid var(--bd);border-radius:4px;padding:1px 6px;font-size:9px;cursor:pointer}
  .ehead .del:hover{color:var(--dan);border-color:var(--dan)}

  .ebody{display:none;border-top:1px solid var(--bd)}
  .ecard.open .ebody{display:grid;grid-template-columns:280px 1fr 270px;height:440px}
  .ecol{min-height:0;display:flex;flex-direction:column;overflow:hidden}.ecol+.ecol{border-left:1px solid var(--bd)}
  .ech{padding:8px 12px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--bd);display:flex;gap:6px;flex:0 0 auto}.ech .n{margin-left:auto;opacity:.6}.ech .arrow{color:var(--acc);opacity:.5}

  .seqwrap{flex:1;overflow-y:auto;padding:14px 12px}
  .cap{font-size:8px;letter-spacing:1.5px;color:var(--mut);opacity:.45;text-transform:uppercase;text-align:center;padding:4px 0}
  .step{position:relative;border:1px solid var(--bd);border-radius:7px;background:var(--elev);padding:7px 9px;margin-top:-7px;cursor:pointer;transition:all .16s cubic-bezier(.4,0,.2,1);box-shadow:0 -4px 10px rgba(0,0,0,.45)}
  .step:hover{transform:translateX(5px);z-index:5} .step.sel{transform:translateX(10px);z-index:9;border-color:var(--acc);box-shadow:-4px 0 0 0 var(--acc),0 6px 16px rgba(0,0,0,.55)}
  .step.disabled{opacity:.4} .step.recalc{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn)}
  .step .mrow{display:flex;align-items:center;gap:7px;font-size:11px}
  .step .chk{width:13px;height:13px;border:1px solid var(--bd);border-radius:3px;flex:0 0 13px;display:grid;place-items:center;font-size:9px}
  .step .chk.on{background:var(--suc);border-color:var(--suc);color:var(--bg)}
  .step .mg{width:14px;text-align:center;color:var(--acc)}.step .mname{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .step .mnum{font-size:8px;color:var(--mut);border:1px solid var(--bd);border-radius:3px;padding:0 4px}
  .step .rf{font-size:8px;color:var(--warn);margin-left:4px}
  .step.evalmark::after{content:"⚗";position:absolute;right:7px;top:-6px;font-size:9px;color:var(--warn);background:#0d1117;padding:0 3px;border-radius:3px}
  .input{position:relative;border:1px solid var(--acc);border-radius:7px;background:linear-gradient(180deg,#10202e,#0d1117);padding:8px 9px;margin-top:4px;cursor:pointer;transition:all .16s}
  .input.sel{box-shadow:-4px 0 0 0 var(--acc);transform:translateX(8px)}.input .mrow{display:flex;align-items:center;gap:7px;font-size:11px}.input .mg{color:var(--acc)}.input .mname{flex:1;font-weight:700;color:var(--acc)}.input .tag{font-size:8px;color:var(--mut);border:1px solid var(--bd);border-radius:3px;padding:0 4px}
  .seqtr{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--bd);flex:0 0 auto;align-items:center}
  .addstep{position:relative}.addbtn{padding:4px 10px;border:1px solid var(--acc);color:var(--acc);border-radius:6px;font-size:9px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}.addbtn:hover{background:var(--acc);color:var(--bg)}
  .addmenu{display:none;position:absolute;bottom:28px;left:0;background:var(--elev);border:1px solid var(--bd);border-radius:6px;overflow:hidden;z-index:20;min-width:130px}.addmenu.open{display:block}.addmenu div{padding:6px 10px;font-size:10px;cursor:pointer}.addmenu div:hover{background:var(--acc);color:var(--bg)}

  .outwrap{position:relative;background:radial-gradient(ellipse at 50% 42%,#11161f,#0a0d12 72%)}
  .outwrap .ph{position:absolute;inset:30px 0 0 0}
  .phud{position:absolute;font-size:10px;color:var(--mut);pointer-events:none}.phud.tl{top:40px;left:12px;display:flex;flex-direction:column;gap:2px}.phud.tl .o{color:var(--tx);font-weight:700;font-size:11px}.phud.tl .o .s{color:var(--sov)}.phud.tl .h{color:var(--acc)}.phud.tl .e{color:var(--warn)}.phud.bl{bottom:10px;left:12px;opacity:.6}.phud.br{bottom:10px;right:12px;opacity:.6}

  .controls{overflow-y:auto;padding:14px 12px}
  .ctxlbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:10px;opacity:.75}
  .ccard{border:1px solid var(--bd);border-radius:7px;background:var(--surf);padding:8px 11px;margin-top:-9px;box-shadow:0 -4px 10px rgba(0,0,0,.4);position:relative;transition:all .18s}.ccard:first-of-type{margin-top:0}.ccard:hover{transform:translateX(-5px);border-color:var(--acc);z-index:4}
  .ccard .th{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700}.ccard .th .ti{width:16px;text-align:center}.ccard .td{font-size:9px;color:var(--mut);margin-top:3px;line-height:1.4}
  .ctrl{display:flex;align-items:center;gap:8px;margin:7px 0}.ctrl label{width:42px;font-size:9px;color:var(--mut);text-transform:uppercase}.ctrl input{flex:1;accent-color:var(--acc);height:3px}.ctrl .v{width:34px;text-align:right;font-size:10px}
  .ops{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.op{padding:4px 8px;border:1px solid currentColor;border-radius:4px;font-size:9px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}.op.acc{color:var(--acc)}.op.sov{color:var(--sov)}.op.mut{color:var(--mut)}.op.dan{color:var(--dan)}.op:hover{background:currentColor}.op:hover span{color:var(--bg)}

  .addcard{border:1px dashed var(--bd);border-radius:11px;padding:14px;text-align:center;color:var(--acc);cursor:pointer;font-size:11px;letter-spacing:.5px}
  .addcard:hover{border-color:var(--acc);background:rgba(88,166,255,.05)}

  /* DISPLAY toggles (per-component, was cardnav) */
  .display{display:flex;gap:5px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd);background:#0c1016}
  .display .dl{font-size:8px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase;margin-right:4px}
  .pill{display:flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--bd);border-radius:6px;font-size:9.5px;letter-spacing:.4px;color:var(--mut);cursor:pointer;background:transparent;transition:all .14s;user-select:none}
  .pill:hover{border-color:var(--acc);color:var(--tx)}
  .pill.on{border-color:var(--suc);color:var(--suc);background:rgba(63,185,80,.08)}
  .pill .led{width:6px;height:6px;border-radius:50%;background:var(--bd);transition:all .14s}
  .pill.on .led{background:var(--suc);box-shadow:0 0 6px var(--suc)}

  /* ===== compRow becomes the scope-boundary host. The gear hangs OUTSIDE ===== */
  .compRow{position:relative;padding-bottom:20px}

  /* GREEN GEAR · attached to bottom-left, OUTSIDE the card border, connected
     by a 1px stub. This is where the "between" options live — actions whose
     effects propagate beyond the card's scope (fork → sibling in chain;
     release → catalog). View-only toggles (eval/loop/flatten) live here too
     because they're per-component flow modes that read from outside (the
     chain queries each component's eval mode while drawing FEEDS). */
  .compGear{position:absolute;bottom:-2px;left:14px;width:24px;height:24px;border-radius:50%;background:var(--surf);border:1.5px solid var(--suc);display:grid;place-items:center;cursor:pointer;color:var(--suc);font-size:13px;z-index:5;transition:all .14s}
  .compGear::before{content:"";position:absolute;top:-9px;left:50%;width:1px;height:9px;background:var(--suc);transform:translateX(-50%)}
  .compGear:hover{background:var(--suc);color:var(--bg);transform:scale(1.06)}
  .compGear.open{background:var(--suc);color:var(--bg);box-shadow:0 0 0 3px rgba(63,185,80,.25)}

  /* between-options popup (was the right tab content) */
  .compGearPop{position:absolute;bottom:32px;left:8px;background:var(--elev);border:1px solid var(--suc);border-radius:8px;padding:5px;display:none;z-index:50;min-width:160px;box-shadow:0 8px 28px rgba(0,0,0,.65)}
  .compGearPop.open{display:block}
  .compGearPop .pophead{font-size:8px;letter-spacing:1.5px;color:var(--suc);text-transform:uppercase;padding:3px 6px 6px;border-bottom:1px solid var(--bd);margin-bottom:4px}
  .compGearPop .gopt{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:10px;cursor:pointer;border-radius:5px;color:var(--mut)}
  .compGearPop .gopt:hover{background:var(--surf);color:var(--tx)}
  .compGearPop .gopt.on{color:var(--suc)}
  .compGearPop .gopt .gi{width:14px;text-align:center;font-size:12px}
  .compGearPop .gopt .gl{flex:1}
  .compGearPop .gopt .gm{font-size:8px;color:var(--mut);opacity:.75}
  .compGearPop .gdiv{height:1px;background:var(--warn);opacity:.4;margin:4px 4px}
  .compGearPop .gopt.commit{color:var(--warn)}
  .compGearPop .gopt.commit:hover{background:rgba(210,153,34,.1)}

  .feeds{text-align:center;font-size:9px;color:var(--mut);letter-spacing:1px;margin:6px 0 -2px 0}
  .feeds b{color:var(--acc)}
  .loopline{text-align:center;font-size:9px;color:var(--warn);letter-spacing:1px;margin:2px 0}

  /* ===== FOOT · gear + terminal + status ===== */
  #foot{display:flex;align-items:center;gap:8px;padding:0 10px;border-top:1px solid var(--bd);font-size:9px;color:var(--mut);background:#0b0e13}
  #foot .gear{font-size:14px;cursor:pointer;color:var(--mut);transition:all .14s;padding:2px 6px;border:1px solid var(--bd);border-radius:5px}
  #foot .gear:hover{color:var(--sov);border-color:var(--sov)}
  #foot input.term{background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:3px 8px;color:var(--tx);font-size:11px;font-family:inherit;width:280px;outline:none}
  #foot input.term:focus{border-color:var(--acc)}
  #foot input.term::placeholder{color:var(--mut);opacity:.6;font-style:italic}
  #foot .dot{width:6px;height:6px;border-radius:50%;background:var(--suc);box-shadow:0 0 7px var(--suc)}
  .pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  #foot .log{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}#foot .log b{color:var(--suc)}
  #foot .fps{font-size:8px;color:var(--mut);opacity:.5}

  /* RELEASE info popup */
  #relInfo{position:absolute;top:50px;right:120px;width:280px;background:var(--elev);border:1px solid var(--suc);border-radius:12px;padding:14px;z-index:60;display:none;box-shadow:0 18px 50px rgba(0,0,0,.7)}
  #relInfo.open{display:block}
  #relInfo .sih{font-size:11px;color:var(--suc);font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:8px}
  #relInfo .row{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin:4px 0}
  #relInfo .row b{color:var(--tx)}
  #relInfo .acts{display:flex;gap:8px;margin-top:10px}
  #relInfo .b{flex:1;padding:7px;border-radius:7px;font-size:9px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border:1px solid;text-align:center}
  #relInfo .b.fork{border-color:var(--sov);color:var(--sov)}.b.fork:hover{background:var(--sov);color:var(--bg)}
  #relInfo .b.x{border-color:var(--bd);color:var(--mut)}
</style>
</head>
<body>
<div id="shell">

  <!-- BRAND row -->
  <div id="brand">
    <div class="logo"><b>GENTLY</b><span>shell</span></div>
    <span class="ctx-lbl">Build ·</span><div class="ctx" id="buildCtx"><b id="ctxBuild">—</b><div class="builddrop" id="buildDrop"></div></div>
    <span class="ctx-lbl">Stage ·</span><div class="ctx"><b id="ctxStage">—</b></div>
    <div class="right">
      <div class="catalog">
        <span class="lbl">Catalog ·</span>
        <span id="catN" style="font-size:10px;color:var(--acc);font-weight:700">0</span>
        <div class="dots" id="catDots"></div>
      </div>
      <span class="fps" id="hFps">— fps</span>
      <span class="add-stage" id="quickAdd">+ Stage</span>
    </div>
  </div>

  <!-- CONSTRUCT ribbon (merged chain-cap; was a separate row) -->
  <div id="construct">
    <div class="lbl"><b>Construct</b><span>compose engine components into the chain</span></div>
    <input class="cprompt" id="cprompt" placeholder="describe the engine component — e.g. spiky twisted goo that smooths on top" autocomplete="off" />
    <div class="scopes" id="scopes"></div>
    <span class="go" id="goBuild">⛓ GO</span>
  </div>

  <!-- MAIN: feed only (no chain-cap), hidden when empty -->
  <div id="main">
    <div id="feed"></div>
  </div>

  <!-- FOOT -->
  <div id="foot">
    <span class="gear" id="gearBtn" title="prefs · apps · launchers (next: app launcher)">⚙</span>
    <input class="term" id="termIn" placeholder="↳ shelf out · type 'fork', 'release', or any prompt to compose" />
    <span class="dot pulse"></span>
    <span class="log" id="statusLog"></span>
  </div>
</div>

<div id="relInfo"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function hsig(p){let s=0;for(const k in p)s+=p[k]*37;let h=((s*2654435761)>>>0);return '0x'+h.toString(16).padStart(8,'0').slice(0,8);}

// STEP registry
const STEPS={
  noise:{g:'∿',label:'Noise',def:{amp:.3,freq:1.4},schema:[['amp','amp',0,1,.01,v=>(+v).toFixed(2)],['freq','frq',.3,4,.05,v=>(+v).toFixed(2)]],desc:'displace along normal · fbm'},
  spike:{g:'✦',label:'Spike',def:{amount:.25},schema:[['amount','amt',0,1,.01,v=>(+v).toFixed(2)]],desc:'sharp spikes · pow falloff'},
  twist:{g:'⟲',label:'Twist',def:{angle:.5},schema:[['angle','ang',-1.5,1.5,.02,v=>(+v).toFixed(2)]],desc:'rotate around Y by height'},
  bend:{g:'⌒',label:'Bend',def:{amount:.2},schema:[['amount','amt',-.5,.5,.01,v=>(+v).toFixed(2)]],desc:'parabolic lean'},
  smooth:{g:'◠',label:'Smooth',def:{factor:.25},schema:[['factor','fac',0,1,.01,v=>(+v).toFixed(2)]],desc:'relax toward input · removes spikes below'},
  hue:{g:'◐',label:'HueShift',def:{hue:300},schema:[['hue','hue',0,360,1,v=>Math.round(v)]],desc:'set material hue'},
};
let sid=0;const S=(k,p)=>({id:'s'+(sid++),k,params:Object.assign({},STEPS[k].def,p||{}),enabled:true});

const defView=()=>({sequence:true,controls:true,grid:false,output:true});

function fbm(x,y,z,t){return Math.sin(x*1.7+t)*.5+Math.sin(y*2.3-t*.7)*.3+Math.sin(z*1.3+t*.5)*.4+Math.sin((x+y+z)*.9+t*.3)*.3;}

function applyStep(m,P,hue,t){const p=m.params;
  if(m.k==='noise'){const F=p.freq;for(let i=0;i<vC;i++){const ix=i*3,x=P[ix],y=P[ix+1],z=P[ix+2],L=Math.hypot(x,y,z)||1;const n=fbm(x*F,y*F,z*F,t),d=p.amp*.55*n;P[ix]+=x/L*d;P[ix+1]+=y/L*d;P[ix+2]+=z/L*d;}}
  else if(m.k==='spike'){for(let i=0;i<vC;i++){const ix=i*3,x=P[ix],y=P[ix+1],z=P[ix+2],L=Math.hypot(x,y,z)||1;const sp=Math.pow(Math.max(0,fbm(x*2+5,y*2,z*2,t*1.3)),3),d=p.amount*.9*sp;P[ix]+=x/L*d;P[ix+1]+=y/L*d;P[ix+2]+=z/L*d;}}
  else if(m.k==='twist'){for(let i=0;i<vC;i++){const ix=i*3,x=P[ix],y=P[ix+1],z=P[ix+2];const a=p.angle*(y/2),c=Math.cos(a),s=Math.sin(a);P[ix]=x*c-z*s;P[ix+2]=x*s+z*c;}}
  else if(m.k==='bend'){for(let i=0;i<vC;i++){const ix=i*3,y=P[ix+1];P[ix]+=p.amount*(y*y);}}
  else if(m.k==='smooth'){const f=p.factor;for(let i=0;i<vC;i++){const ix=i*3,x=P[ix],y=P[ix+1],z=P[ix+2],L=Math.hypot(x,y,z)||1;P[ix]+=(x/L*2-x)*f;P[ix+1]+=(y/L*2-y)*f;P[ix+2]+=(z/L*2-z)*f;}}
  else if(m.k==='hue')return p.hue;return hue;
}
function topEnabled(c){let t=-1;c.stack.forEach((m,i)=>{if(m.enabled)t=i;});return t;}
function evalIndex(c){return c.flow.eval==='full'?topEnabled(c):c.sel;}
function evalComponent(c,t){const base=c.baseOverride||orig,P=geo.attributes.position.array;for(let i=0;i<P.length;i++)P[i]=base[i];
  let hue=c.baseHue;const upto=evalIndex(c);for(let m=0;m<=upto;m++){const mod=c.stack[m];if(!mod||!mod.enabled)continue;hue=applyStep(mod,P,hue,t);}
  geo.attributes.position.needsUpdate=true;geo.computeVertexNormals();const col=hsl(hue);mat.color.copy(col);mat.emissive.copy(col).multiplyScalar(.28);return hue;}
function evalInto(c,upto,target,t){const base=c.baseOverride||orig;for(let i=0;i<target.length;i++)target[i]=base[i];
  let hue=c.baseHue;for(let m=0;m<=upto;m++){const mod=c.stack[m];if(!mod||!mod.enabled)continue;hue=applyStep(mod,target,hue,t);}}

    // gear toggle — close all other open gears first

      document.querySelectorAll('.compGear.open').forEach(g=>g.classList.remove('open'));
      if(!wasOpen){pop.classList.add('open');gear.classList.add('open');}});

    '<div class="gopt'+(c.flow.loop?' on':'')+'" data-act="loop"><span class="gi">⟲</span><span class="gl">Loop</span><span class="gm">'+(c.flow.loop?'on':'off')+'</span></div>'+
    '<div class="gopt'+(c.flow.flatten?' on':'')+'" data-act="flatten"><span class="gi">⊟</span><span class="gl">Flatten</span><span class="gm">'+(c.flow.flatten?'on':'off')+'</span></div>'+
    '<div class="gdiv"></div>'+
    '<div class="gopt commit" data-act="fork"><span class="gi">⑂</span><span class="gl">Fork</span><span class="gm">→ sibling</span></div>'+
    '<div class="gopt commit" data-act="release"><span class="gi">▶</span><span class="gl">Release</span><span class="gm">→ catalog</span></div>';
}
function compFlowOp(c,i,act){
  const evalNext={isolate:'full',full:'freeze',freeze:'isolate'};
  if(act==='eval'){c.flow.eval=evalNext[c.flow.eval];if(c.flow.eval==='freeze')c.flow.freezeT=performance.now()*0.0004;}
  else if(act==='loop'){c.flow.loop=!c.flow.loop;}
  else if(act==='flatten'){c.flow.flatten=!c.flow.flatten;}
  else if(act==='fork'){forkComponent(i);}
  else if(act==='release'){releaseComponent(i);}
  render();
}
function forkComponent(i){const src=components[i];const cl={
  name:src.name+'.fork',glyph:src.glyph,baseHue:src.baseHue,sel:src.sel,
  view:Object.assign({},src.view),flow:defFlow(),
  scopes:src.scopes?[...src.scopes]:[],
  baseOverride:src.baseOverride?Float32Array.from(src.baseOverride):null,
  stack:src.stack.map(m=>S(m.k,m.params))
};components.splice(i+1,0,cl);expanded=i+1;log('⑂ forked '+src.name+' → '+cl.name);}
function releaseComponent(i){const src=components[i];const hash='0x'+((Math.random()*0xffffffff)>>>0).toString(16).padStart(8,'0');
  releases.push({name:src.name,glyph:src.glyph,hash,at:Date.now(),engines:1,status:'live',snapshot:[{name:src.name,glyph:src.glyph,baseHue:src.baseHue,sel:src.sel,view:Object.assign({},src.view),scopes:src.scopes?[...src.scopes]:[],baseOverride:src.baseOverride?Float32Array.from(src.baseOverride):null,stack:src.stack.map(m=>S(m.k,m.params))}]});
  log('▶ released '+src.name+' → CATALOG · '+hash);}

function mountBody(card,c,ci){

function sizeCanvas(ph){const w=ph.clientWidth,h=ph.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}

function renderStack(card,c){const el=card.querySelector('[data-stack]');card.querySelector('[data-n]').textContent=c.stack.length+' STEPs';el.innerHTML='';
  const evi=evalIndex(c);el.insertAdjacentHTML('beforeend','<div class="cap">[ TOP — EVALUATES LAST ]</div>');
  for(let i=c.stack.length-1;i>=0;i--){const m=c.stack[i],reg=STEPS[m.k];
    const d=document.createElement('div');d.className='step'+(i===c.sel?' sel':'')+(m.enabled?'':' disabled')+(i===evi&&c.flow.eval!=='full'?' evalmark':'')+(performance.now()<recalcUntil&&i>c.sel?' recalc':'');
    d.innerHTML='<div class="mrow"><span class="chk '+(m.enabled?'on':'')+'">'+(m.enabled?'✓':'')+'</span><span class="mg">'+reg.g+'</span><span class="mname">'+reg.label+'</span>'+(performance.now()<recalcUntil&&i>c.sel?'<span class="rf">↑recalc</span>':'')+'<span class="mnum">'+(i+1)+'</span></div>';
    d.querySelector('.chk').addEventListener('click',e=>{e.stopPropagation();m.enabled=!m.enabled;renderStack(card,c);renderTools(card,c);});
    d.addEventListener('click',()=>{c.sel=i;renderStack(card,c);renderTools(card,c);renderHud(card,c);});el.appendChild(d);}
  const inp=document.createElement('div');inp.className='input'+(c.sel===-1?' sel':'');
  inp.innerHTML='<div class="mrow"><span class="mg">▣</span><span class="mname">'+c.name+'</span><span class="tag">'+(c.baseOverride?'baked input':'input')+'</span></div>';
  inp.addEventListener('click',()=>{c.sel=-1;renderStack(card,c);renderTools(card,c);renderHud(card,c);});el.appendChild(inp);
  el.insertAdjacentHTML('beforeend','<div class="cap">[ BOTTOM — INPUT · DATA FLOWS ↑ ]</div>');}

function renderTools(card,c){const el=card.querySelector('[data-tools]');el.innerHTML='';const m=c.sel>=0?c.stack[c.sel]:null;
  if(!m){el.innerHTML='<div class="ctxlbl">input</div><div class="ccard"><div class="th"><span class="ti" style="color:var(--acc)">▣</span> input</div><div class="td">the starting point all STEPs evaluate on top of.</div></div>';return;}
  const reg=STEPS[m.k];const ctx=document.createElement('div');ctx.className='ctxlbl';ctx.textContent='STEP '+(c.sel+1)+' · '+reg.label;el.appendChild(ctx);
  let html='<div class="th"><span class="ti" style="color:var(--sov)">'+reg.g+'</span> '+reg.label+'</div><div class="td">'+reg.desc+'</div>';
  reg.schema.forEach(([k,lab,min,max,step])=>{html+='<div class="ctrl"><label>'+lab+'</label><input type="range" data-k="'+k+'" min="'+min+'" max="'+max+'" step="'+step+'"><span class="v" data-v="'+k+'"></span></div>';});
  const ed=document.createElement('div');ed.className='ccard';ed.innerHTML=html;el.appendChild(ed);
  reg.schema.forEach(([k,lab,min,max,step,fmt])=>{const r=ed.querySelector('input[data-k="'+k+'"]'),v=ed.querySelector('[data-v="'+k+'"]');r.value=m.params[k];v.textContent=fmt(m.params[k]);
    r.addEventListener('input',()=>{m.params[k]=+r.value;v.textContent=fmt(+r.value);renderHud(card,c);recalcUntil=performance.now()+650;renderStack(card,c);setTimeout(()=>renderStack(card,c),680);});});
  const ops=document.createElement('div');ops.className='ccard';ops.innerHTML='<div class="th"><span class="ti" style="color:var(--acc)">⚙</span> STEP ops</div><div class="ops"><span class="op '+(m.enabled?'mut':'acc')+'" data-op="toggle"><span>'+(m.enabled?'mute':'unmute')+'</span></span><span class="op acc" data-op="up"><span>↑ up</span></span><span class="op acc" data-op="down"><span>↓ down</span></span><span class="op sov" data-op="collapse"><span>bake</span></span><span class="op dan" data-op="del"><span>✕ remove</span></span></div>';
  el.appendChild(ops);ops.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>{doOp(c,b.dataset.op);renderStack(card,c);renderTools(card,c);renderHud(card,c);}));}
function doOp(c,op){const s=c.stack;
  if(op==='toggle')s[c.sel].enabled=!s[c.sel].enabled;
  else if(op==='up'&&c.sel<s.length-1){[s[c.sel],s[c.sel+1]]=[s[c.sel+1],s[c.sel]];c.sel++;}
  else if(op==='down'&&c.sel>0){[s[c.sel],s[c.sel-1]]=[s[c.sel-1],s[c.sel]];c.sel--;}
  else if(op==='del'){s.splice(c.sel,1);c.sel=Math.min(c.sel,s.length-1);}
  else if(op==='collapse'){const baked=Float32Array.from(c.baseOverride||orig);evalInto(c,c.sel,baked,performance.now()*0.0004);c.baseOverride=baked;const n=c.sel+1;s.splice(0,n);c.sel=-1;log('⤓ baked → input · froze '+n+' STEP'+(n>1?'s':''));}}
function renderAddMenu(card,c){const menu=card.querySelector('[data-addmenu]'),btn=card.querySelector('[data-add]');menu.innerHTML='';
  Object.keys(STEPS).forEach(k=>{const d=document.createElement('div');d.textContent=STEPS[k].g+'  '+STEPS[k].label;d.addEventListener('click',e=>{e.stopPropagation();c.stack.splice(c.sel+1,0,S(k));c.sel++;menu.classList.remove('open');renderStack(card,c);renderTools(card,c);});menu.appendChild(d);});
  btn.addEventListener('click',e=>{e.stopPropagation();menu.classList.toggle('open');});}
function renderHud(card,c){const oE=card.querySelector('[data-o]');if(!oE)return;const evi=evalIndex(c);oE.innerHTML=c.name+' <span class="s">· '+(c.sel>=0&&c.stack[c.sel]?STEPS[c.stack[c.sel].k].label:'input')+'</span>';
  card.querySelector('[data-e]').textContent='eval ↑ '+(evi<0?'input':STEPS[c.stack[evi].k].label)+(c.flow.eval==='full'?' (end)':c.flow.eval==='freeze'?' (frozen)':'');}

function constructComponent(text){
  const lc=text.toLowerCase(),order=[];
  [['noise','noise'],['spike','spike'],['sharp','spike'],['twist','twist'],['bend','bend'],['curve','bend'],['smooth','smooth'],['relax','smooth'],['hue','hue'],['color','hue'],['colour','hue']].forEach(([w,k])=>{if(lc.includes(w)&&!order.includes(k))order.push(k);});
  const scopeSeed={'scene·3d':['smooth'],'character':['spike','twist'],'video':['noise','hue'],'game':['twist','bend'],'document':['smooth'],'audio':['noise']};
  composeScopes.forEach(s=>(scopeSeed[s]||[]).forEach(k=>{if(!order.includes(k))order.push(k);}));
  if(order.length===0)order.push('noise','smooth');
  const stack=order.map(k=>S(k));
  let h=0;for(let i=0;i<text.length;i++)h=(h*31+text.charCodeAt(i))>>>0;
  const baseHue=text?h%360:(components.length*60+200)%360;
  const slug=text.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(Boolean).slice(0,3).join('.');
  const glyphs=['◉','◇','◈','⬡','✶','◐','✦'];const scopes=[...composeScopes];
  const newComp={name:slug||('component.'+(components.length+1)),glyph:glyphs[components.length%glyphs.length],baseHue,sel:stack.length-1,view:defView(),flow:defFlow(),stack,scopes};
  components.push(newComp);
  builds[activeBuild].body=components;
  expanded=components.length-1;
  log('⛓ constructed → '+newComp.name+' ('+stack.length+' STEPs'+(scopes.length?' · ['+scopes.join('+')+']':'')+')');
  composeScopes=new Set();render();
}

// ===== BUILD dropdown (in brand row) =====
const buildCtx=document.getElementById('buildCtx');const buildDrop=document.getElementById('buildDrop');
buildCtx.addEventListener('click',e=>{e.stopPropagation();buildDrop.classList.toggle('open');});
function renderBuildDrop(){buildDrop.innerHTML='';
  builds.forEach((bd,i)=>{const d=document.createElement('div');d.className='bopt'+(i===activeBuild?' active':'');d.innerHTML='<span class="bg">'+bd.glyph+'</span><span>'+bd.name+'</span>';
    d.addEventListener('click',e=>{e.stopPropagation();activeBuild=i;components=builds[i].body;expanded=components.length?components.length-1:-1;buildDrop.classList.remove('open');render();});buildDrop.appendChild(d);});
  const acts=document.createElement('div');acts.className='bact';
  acts.innerHTML='<span data-act="forkb">⑂ fork build</span><span data-act="releaseb">▶ release build</span>';
  acts.querySelector('[data-act="forkb"]').addEventListener('click',e=>{e.stopPropagation();forkBuild();buildDrop.classList.remove('open');});
  acts.querySelector('[data-act="releaseb"]').addEventListener('click',e=>{e.stopPropagation();releaseBuild();buildDrop.classList.remove('open');});
  buildDrop.appendChild(acts);
}
function forkBuild(){const src=builds[activeBuild];const cl=src.body.map(c=>({name:c.name,glyph:c.glyph,baseHue:c.baseHue,sel:c.sel,view:Object.assign({},c.view||defView()),flow:Object.assign({},c.flow||defFlow()),scopes:c.scopes?[...c.scopes]:[],baseOverride:c.baseOverride?Float32Array.from(c.baseOverride):null,stack:c.stack.map(m=>S(m.k,m.params))}));
  const bg=['▦','▥','◰','◳','⬚','▤','◧'];builds.push({name:src.name+'.fork',glyph:bg[builds.length%bg.length],body:cl});activeBuild=builds.length-1;components=cl;expanded=cl.length-1;log('⑂ forked build → '+builds[activeBuild].name);render();}
function releaseBuild(){const bd=builds[activeBuild];const snapshot=bd.body.map(c=>({name:c.name,glyph:c.glyph,baseHue:c.baseHue,sel:c.sel,view:Object.assign({},c.view||defView()),scopes:c.scopes?[...c.scopes]:[],baseOverride:c.baseOverride?Float32Array.from(c.baseOverride):null,stack:c.stack.map(m=>S(m.k,m.params))}));
  const hash='0x'+((Math.random()*0xffffffff)>>>0).toString(16).padStart(8,'0');
  releases.push({name:bd.name,glyph:bd.glyph,hash,at:Date.now(),engines:bd.body.length,status:'live',snapshot});
  log('▶ released build '+bd.name+' → CATALOG · '+hash);renderCatalogDots();}

// ===== CATALOG =====
function renderCatalogDots(){const el=document.getElementById('catDots');el.innerHTML='';document.getElementById('catN').textContent=releases.length;
  releases.forEach((r,i)=>{const d=document.createElement('span');d.className='reldot';d.title=r.name+' · '+r.hash;d.addEventListener('click',e=>{e.stopPropagation();openRelInfo(i,d);});el.appendChild(d);});}
function fmtUptime(ms){const s=Math.floor(ms/1000);const m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0');}
function openRelInfo(i,anchor){const L=releases[i];const box=document.getElementById('relInfo');
  box.innerHTML='<div class="sih">'+L.glyph+' '+L.name+' · CATALOG entry</div>'+
    '<div class="row"><span>status</span><b style="color:var(--suc)">● '+L.status+'</b></div>'+
    '<div class="row"><span>address</span><b>cat://'+L.hash.slice(2,10)+'.gently.io</b></div>'+
    '<div class="row"><span>released</span><b>'+new Date(L.at).toLocaleTimeString('en-GB')+'</b></div>'+
    '<div class="row"><span>uptime</span><b data-upinfo>'+fmtUptime(Date.now()-L.at)+'</b></div>'+
    '<div class="row"><span>components</span><b>'+L.engines+'</b></div>'+
    '<div class="row"><span>hash</span><b style="color:var(--acc)">'+L.hash+'</b></div>'+
    '<div class="acts"><span class="b fork" data-fork>fork → VERSIONS</span><span class="b x" data-close>close</span></div>';
  const r=anchor.getBoundingClientRect();box.style.right=Math.max(40,window.innerWidth-r.left+8)+'px';box.style.top=(r.bottom+8)+'px';box.classList.add('open');
  box.querySelector('[data-close]').addEventListener('click',()=>box.classList.remove('open'));
  box.querySelector('[data-fork]').addEventListener('click',()=>{const bg=['▦','▥','◰','◳','⬚','▤','◧'];const body=L.snapshot.map(c=>({name:c.name,glyph:c.glyph,baseHue:c.baseHue,sel:c.sel,view:Object.assign({},c.view||defView()),flow:defFlow(),scopes:[...(c.scopes||[])],baseOverride:c.baseOverride?Float32Array.from(c.baseOverride):null,stack:c.stack.map(m=>S(m.k,m.params))}));builds.push({name:L.name+'.fork',glyph:bg[builds.length%bg.length],body});activeBuild=builds.length-1;components=body;expanded=body.length-1;box.classList.remove('open');log('⑂ forked CATALOG entry '+L.name);render();});}
document.addEventListener('click',e=>{const b=document.getElementById('relInfo');if(b.classList.contains('open')&&!e.target.closest('#relInfo')&&!e.target.closest('.reldot'))b.classList.remove('open');
  if(!e.target.closest('#buildCtx'))buildDrop.classList.remove('open');
  if(!e.target.closest('[data-add]'))document.querySelectorAll('.addmenu').forEach(m=>m.classList.remove('open'));
  // close gear popups on outside click
  if(!e.target.closest('.compGear')&&!e.target.closest('.compGearPop')){
    document.querySelectorAll('.compGearPop.open').forEach(p=>p.classList.remove('open'));
    document.querySelectorAll('.compGear.open').forEach(g=>g.classList.remove('open'));
  }});

document.getElementById('gearBtn').addEventListener('click',()=>{log('⚙ gear — app launcher TBD (next phase: dockerized apps)');});

// terminal: fork / release / release <name> / <prompt>
document.getElementById('termIn').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;e.preventDefault();
  const cmd=(e.target.value||'').trim();if(!cmd)return;
  const lc=cmd.toLowerCase();
  if(lc==='fork'){forkBuild();}
  else if(lc==='release'){releaseBuild();}
  else if(lc.startsWith('release ')){const idx=components.findIndex(x=>x.name===cmd.slice(8).trim());if(idx>=0)releaseComponent(idx);else log('no component '+cmd.slice(8));}
  else if(lc==='clear'){components.length=0;builds[activeBuild].body=components;expanded=-1;render();log('cleared chain');}
  else{constructComponent(cmd);}
  e.target.value='';
});

const sl=document.getElementById('statusLog');let logs=[];
function log(m){const ts=new Date().toLocaleTimeString('en-GB');logs.unshift('<b>'+ts+'</b> '+m);logs=logs.slice(0,3);sl.innerHTML=logs.join(' &nbsp;·&nbsp; ');}

let lastT=performance.now(),fps=60;
function loop(now){const dt=(now-lastT)/1000;lastT=now;fps+=((1/Math.max(dt,1e-4))-fps)*.1;document.getElementById('hFps').textContent=Math.round(fps)+' fps';
  const c=components[expanded];
  if(c){const card=feed.querySelector('.ecard.open');if(card){
      const sc=c.view&&c.view.grid;wire.material.opacity=sc?0.55:0.1;grid.visible=!!sc;
      const t=c.flow.eval==='freeze'?c.flow.freezeT:now*0.0004;const hue=evalComponent(c,t);
      const hh=card.querySelector('[data-h]');if(hh)hh.textContent='sig '+hsig({h:Math.round(hue),n:c.stack.length,e:evalIndex(c)});
      blob.rotation.y+=0.0008;wire.rotation.y=blob.rotation.y;if(autoSpin&&c.flow.eval!=='freeze'){theta+=0.0015;cam();}
      if(card.querySelector('[data-ph]'))renderer.render(scene,camera);}}
  requestAnimationFrame(loop);}
window.addEventListener('resize',()=>{const card=feed.querySelector('.ecard.open');if(card){const ph=card.querySelector('[data-ph]');if(ph)sizeCanvas(ph);}});
function init(){render();log('shell online · per-component tabs · empty chain hides pane');requestAnimationFrame(loop);}
init();
</script>
</body>
