<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="{theme_color}">
  <title>{title}</title>
  <script src="https://unpkg.com/htmx.org@1.9.10" crossorigin="anonymous"
          integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55; color: #1a1a1a; background: #fafafa;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 1.25rem 1.1rem 6rem; }
    header.brand {
      display: flex; align-items: center; gap: .65rem;
      padding: .9rem 1.1rem; background: {brand_bg}; color: {brand_fg};
      position: sticky; top: 0; z-index: 10;
      box-shadow: 0 1px 0 rgba(0,0,0,.06);
    }
    header.brand .mark {
      width: 28px; height: 28px; border-radius: 6px;
      background: {brand_fg}; color: {brand_bg};
      display: grid; place-items: center;
      font-weight: 700; font-size: .85rem;
    }
    header.brand .name { font-weight: 700; letter-spacing: .02em; }
    header.brand .name small { font-weight: 400; opacity: .85; margin-left: .35rem; }
    nav.tabs {
      display: flex; gap: .3rem; padding: .5rem 1.1rem; background: #fff;
      border-bottom: 1px solid #e6e6e6; position: sticky; top: 50px; z-index: 9;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    nav.tabs a {
      display: inline-block; padding: .45rem .85rem; border-radius: 6px;
      color: #444; text-decoration: none; font-size: .92rem; white-space: nowrap;
    }
    nav.tabs a:hover { background: #f0f0f0; }
    nav.tabs a.active { background: {brand_bg}; color: {brand_fg}; font-weight: 600; }
    h1 { font-size: 1.45rem; margin: 1.2rem 0 .35rem; }
    h2 { font-size: 1.05rem; margin: 1.4rem 0 .25rem; color: #333; }
    h3 { font-size: .95rem; margin: .9rem 0 .2rem; color: #555; }
    p, ul, ol { margin: .45rem 0; }
    ul, ol { padding-left: 1.25rem; }
    li + li { margin-top: .25rem; }
    code, pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .88em; background: #f0f0f0; padding: 0 .25rem; border-radius: 3px;
    }
    pre { padding: .65rem .8rem; overflow-x: auto; }
    .meta { color: #666; font-size: .85rem; }
    .panel {
      background: #fff; border: 1px solid #e6e6e6;
      border-radius: 10px; padding: 1rem 1.1rem; margin: 1rem 0;
    }
    .panel.tight { padding: .85rem 1rem; }
    .panel.warn  { border-color: #f0c040; background: #fff8e1; }
    .panel.ok    { border-color: #66bb6a; background: #effaf0; }
    .panel.dark  { background: #1a1a1a; color: #e0e0e0; border-color: #2a2a2a; }
    .product {
      background: #fff; border: 1px solid #e6e6e6; border-radius: 10px;
      padding: 1rem 1.1rem; margin: .8rem 0;
    }
    .product .head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
    .product h3 { margin: 0; font-size: 1rem; color: #1a1a1a; }
    .product .price { font-weight: 700; font-size: 1.05rem; color: {brand_bg}; }
    .product .pill {
      display: inline-block; font-size: .7rem; padding: .15rem .45rem;
      border-radius: 999px; background: #eee; color: #555;
      text-transform: uppercase; letter-spacing: .05em;
    }
    .product .pill.active { background: #d4edda; color: #155724; }
    .product .pill.design { background: #fff3cd; color: #856404; }
    .product .pay-row { display: flex; gap: .5rem; margin-top: .85rem; flex-wrap: wrap; }
    .product .pay-row button { flex: 1; min-width: 140px; }
    input[type=text], input[type=email], input[type=number], select, textarea {
      width: 100%; padding: .6rem .75rem; font-size: 1rem;
      border: 1px solid #d0d0d0; border-radius: 8px; margin-top: .35rem;
      font-family: inherit;
    }
    input[type=file] {
      width: 100%; padding: .5rem; font-size: .95rem;
      border: 1px dashed #c0c0c0; border-radius: 8px; margin-top: .35rem;
      background: #fafafa;
    }
    button.cta, button.alt {
      display: inline-block; width: 100%;
      padding: .8rem 1rem; border: none; border-radius: 8px;
      font-size: .95rem; font-weight: 600; cursor: pointer;
      transition: filter .15s, transform .05s;
    }
    button.cta { background: {brand_bg}; color: {brand_fg}; }
    button.alt { background: #1a1a1a; color: #fff; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button:not(:disabled):hover { filter: brightness(.92); }
    button:not(:disabled):active { transform: translateY(1px); }
    a.link { color: {brand_bg}; text-decoration: none; font-weight: 600; }
    a.link:hover { text-decoration: underline; }
    .token-display, .addr-display {
      background: #1a1a1a; color: #d0d0d0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .82rem; word-break: break-all;
      padding: .75rem 1rem; border-radius: 8px; margin: .5rem 0;
    }
    .stamp { font-size: .75rem; opacity: .7; margin-top: .8rem; }
    label.row {
      display: flex; align-items: flex-start; gap: .65rem;
      margin-top: .65rem; cursor: pointer;
    }
    label.row input[type=checkbox] {
      margin-top: .25rem; width: 1.05rem; height: 1.05rem; accent-color: {brand_bg};
    }
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: .5rem; }
    @media (min-width: 520px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; opacity: .7; margin-left: .4rem; }
  </style>
</head>
<body>
  <header class="brand">
    <span class="mark">{brand_mark}</span>
    <span class="name">{brand_name}<small>{brand_sub}</small></span>
  </header>
  <nav class="tabs">
    <a href="/dapp/services">services</a>
    <a href="/dapp/mint">mint</a>
    <a href="/dapp/wallet">wallet</a>
    <a href="/dapp/play">play</a>
    <a href="/dapp/play_morph">play_morph</a>
    <a href="/dapp/pump_surf">pump_surf</a>
  </nav>
  <main class="wrap">
    {content}
  </main>
</body>
</html>
