<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MySpace++ Unified Bridge Dashboard</title>
  <style>
    body { background: #050810; color: #aaa; font-family: monospace; margin: 0; padding: 20px; }
    h1 { color: #fff; font-size: 18px; margin-bottom: 5px; }
    .subtitle { color: #666; font-size: 12px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .browser { background: #0a0a15; border: 2px solid #333; border-radius: 6px; padding: 12px; min-height: 180px; }
    .browser.GO { border-color: #2e7; }
    .browser.ACTIVE { border-color: #4488ff; }
    .browser.IDLE { border-color: #eb3; }
    .browser.ERROR { border-color: #f35; }
    .browser-title { font-weight: bold; font-size: 13px; margin-bottom: 8px; color: #fff; }
    .browser-state { float: right; font-size: 11px; }
    .browser-meta { font-size: 11px; line-height: 1.5; }
    .browser-meta .key { color: #666; }
    .browser-meta .val { color: #ccc; }
    .status-bar { display: flex; gap: 20px; margin-bottom: 20px; padding: 10px; background: #0d1525; border-radius: 6px; }
    .status-item { font-size: 12px; }
    .status-item .label { color: #666; }
    .status-item .value { color: #fff; font-weight: bold; }
    button { background: #1a3a2a; color: #2e7; border: 1px solid #2e7; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: monospace; }
    button:hover { background: #2e7; color: #000; }
    .actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    pre { background: #0a0a0a; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 11px; }
    .platform-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .platform { background: #0a0a15; border: 1px solid #333; border-radius: 6px; padding: 12px; }
    .platform h3 { color: #fff; font-size: 13px; margin: 0 0 8px 0; }
    .platform .tools { font-size: 11px; color: #666; }
    .platform .tools span { color: #2e7; margin-right: 8px; cursor: pointer; }
    .platform .tools span:hover { text-decoration: underline; }
    .platform .status { font-size: 11px; margin-top: 8px; }
    .platform .status.ok { color: #2e7; }
    .platform .status.warn { color: #eb3; }
    .platform .status.err { color: #f35; }
    .section-title { color: #fff; font-size: 14px; margin: 20px 0 10px 0; border-bottom: 1px solid #333; padding-bottom: 5px; }
  </style>
</head>
<body>
  <h1>MySpace++ Unified Bridge Dashboard</h1>
  <div class="subtitle">Multi-platform MCP bridge | Auto-refresh every 5s</div>

  <div class="status-bar">
    <div class="status-item"><span class="label">Coherence:</span> <span class="value" id="coherence">---</span></div>
    <div class="status-item"><span class="label">Active Tasks:</span> <span class="value" id="active-tasks">---</span></div>
    <div class="status-item"><span class="label">Pending Tasks:</span> <span class="value" id="pending-tasks">---</span></div>
    <div class="status-item"><span class="label">Last Tick:</span> <span class="value" id="last-tick">---</span></div>
  </div>

  <div class="actions">
    <button onclick="refresh()">Refresh Now</button>
    <button onclick="checkCoherence()">Check Coherence</button>
    <button onclick="predictNext()">Predict Next</button>
    <button onclick="listTrollz()">List Trollz Agents</button>
    <button onclick="listTools()">List All Tools</button>
  </div>

  <div class="section-title">Browser Pool (8 browsers)</div>
  <div class="grid" id="browser-grid"></div>

  <div class="section-title">Platform Status</div>
  <div class="platform-grid" id="platform-grid"></div>

  <div class="section-title">Raw Output</div>
  <pre id="raw">Waiting for data...</pre>

  <script>
    const API_BASE = window.location.origin;

    async function fetchJSON(path, opts={}) {
      const r = await fetch(API_BASE + path, opts);
      return r.json();
    }

    async function refresh() {
      document.getElementById('last-tick').textContent = new Date().toISOString().slice(11,19);
      try {
        const browsers = await fetchJSON('/tools/myspace:query_browser_pool');
        renderBrowsers(browsers);
        document.getElementById('raw').textContent = JSON.stringify(browsers, null, 2);
      } catch (e) {
        document.getElementById('raw').textContent = 'Error: ' + e.message;
      }
    }

    async function checkCoherence() {
      document.getElementById('coherence').textContent = 'checking...';
      try {
        const r = await fetchJSON('/tools/myspace:check_coherence');
        const status = r.result && r.result.pass ? 'PASS' : 'FAIL';
        const el = document.getElementById('coherence');
        el.textContent = status;
        el.style.color = status === 'PASS' ? '#2e7' : '#f35';
      } catch (e) {
        document.getElementById('coherence').textContent = 'ERR';
      }
    }

    async function predictNext() {
      try {
        const r = await fetchJSON('/tools/myspace:predict_next_action');
        alert('Next: ' + (r.result && r.result.prediction ? r.result.prediction.task_id : 'none'));
      } catch (e) { alert(e.message); }
    }

    async function listTrollz() {
      try {
        const r = await fetchJSON('/tools/trollz:list_agents');
        document.getElementById('raw').textContent = JSON.stringify(r, null, 2);
      } catch (e) { document.getElementById('raw').textContent = 'Error: ' + e.message; }
    }

    async function listTools() {
      try {
        const r = await fetchJSON('/tools');
        document.getElementById('raw').textContent = JSON.stringify(r, null, 2);
      } catch (e) { document.getElementById('raw').textContent = 'Error: ' + e.message; }
    }

    function renderBrowsers(data) {
      const grid = document.getElementById('browser-grid');
      grid.innerHTML = '';
      for (let i = 0; i < 8; i++) {
        const key = 'browser-' + i;
        const st = data[key] || {};
        const state = st['todo:state'] || 'UNKNOWN';
        const div = document.createElement('div');
        div.className = 'browser ' + state;
        div.innerHTML = `
          <div class="browser-title">${st['todo:browser-id'] || key}
            <span class="browser-state">${state}</span>
          </div>
          <div class="browser-meta">
            <div><span class="key">Layer:</span> <span class="val">${st['todo:layer'] || '-'}</span></div>
            <div><span class="key">Inference:</span> <span class="val">${st['todo:inference'] || 'none'}</span></div>
            <div><span class="key">Coherence:</span> <span class="val">${st['todo:coherence-check:status'] || '?'}</span></div>
            <div><span class="key">Last update:</span> <span class="val">${st['todo:last-update'] ? st['todo:last-update'].slice(11,16) : '?'}</span></div>
          </div>
        `;
        grid.appendChild(div);
      }
    }

    function renderPlatforms(tools) {
      const grid = document.getElementById('platform-grid');
      grid.innerHTML = '';
      const platforms = {
        'myspace': {name: 'MySpace++', color: '#4488ff'},
        'discord': {name: 'Discord', color: '#5865F2'},
        'hf': {name: 'HuggingFace', color: '#FFD21E'},
        'livepeer': {name: 'Livepeer', color: '#00eb88'},
        'trollz': {name: 'TrollzDotFun', color: '#f35'},
        'social': {name: 'Social Upload', color: '#eb3'},
      };
      for (const [prefix, info] of Object.entries(platforms)) {
        const ptools = tools.filter(t => t.name.startsWith(prefix + ':'));
        const div = document.createElement('div');
        div.className = 'platform';
        div.innerHTML = `
          <h3 style="color:${info.color}">${info.name}</h3>
          <div class="tools">${ptools.map(t => `<span title="${t.description}">${t.name.split(':')[1]}</span>`).join('')}</div>
          <div class="status ok">${ptools.length} tools available</div>
        `;
        grid.appendChild(div);
      }
    }

    async function init() {
      refresh();
      checkCoherence();
      try {
        const tools = await fetchJSON('/tools');
        renderPlatforms(tools.tools || []);
      } catch (e) {}
    }

    init();
    setInterval(refresh, 5000);
    setInterval(checkCoherence, 15000);
  </script>
</body>
</html>
