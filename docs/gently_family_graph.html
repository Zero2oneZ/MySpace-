const tooltip = d3.select("#tooltip");
node.on("mouseover", (event, d) => {
  tooltip.style("opacity", 1).html(`<b>${d.id}</b><br>Path: ${d.path}<br>Internal deps: ${d.internal.join(", ") || "none"}<br>External deps: ${d.external.slice(0,8).join(", ")}${d.external.length > 8 ? "..." : ""}`)
    .style("left", (event.pageX + 10) + "px").style("top", (event.pageY - 10) + "px");
}).on("mouseout", () => tooltip.style("opacity", 0));
simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
function dragstarted(event, d) { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
function dragended(event, d) { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }
document.getElementById("stats").innerHTML = `Crates: ${data.nodes.length}<br>Edges: ${data.edges.length}`;
</script>
</body>
</html>
