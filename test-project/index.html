<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradio-like HTMX Environment</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #0b0c10;
            color: #c5c6c7;
        }
        h1 { color: #66fcf1; margin-bottom: 20px; }
        .gradio-box {
            background: #1f2833;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #45a29e;
        }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #66fcf1; }
        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #181f29;
            border: 1px solid #45a29e;
            border-radius: 6px;
            color: #c5c6c7;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 12px;
        }
        button {
            background: #66fcf1;
            color: #0b0c10;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background: #4db6b0; }
        .output {
            background: #0b0c10;
            border-radius: 6px;
            padding: 16px;
            min-height: 100px;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .status { color: #4db6b0; margin-top: 10px; font-size: 12px; }
        .gradio-row { display: flex; gap: 10px; align-items: flex-end; }
        .gradio-row > * { flex: 1; }
    </style>
</head>
<body>
    <h1>Generative Environment</h1>

    <div class="gradio-box">
        <h3>Inference Loop</h3>
        <label>Input Prompt</label>
        <textarea id="input-prompt" rows="3" placeholder="Enter your prompt here..."></textarea>

        <label>Iterations</label>
        <input type="text" id="iterations" value="5" placeholder="Number of decompile iterations">

        <div class="gradio-row">
            <button hx-post="/generate" hx-target="#output" hx-indicator="#status">
                Generate & Decompile
            </button>
        </div>
        <div id="status" class="status">Ready</div>

        <label>Output</label>
        <div id="output" class="output">Results will appear here...</div>
    </div>

    <div class="gradio-box">
        <h3>Project Hash Loop</h3>
        <div id="project-hash" class="output" style="font-size: 12px;">Computing project hash...</div>
        <button onclick="fetchHashLoop()">Refresh Hash Loop</button>
        <div id="hash-status" class="status"></div>
    </div>

    <script>
        // Monitor status indicator
        document.body.addEventListener('htmx:request', function() {
            document.getElementById('status').innerText = 'Processing...';
        });
        document.body.addEventListener('htmx:response', function() {
            document.getElementById('status').innerText = 'Done';
        });
        document.body.addEventListener('htmx:afterOnLoad', function() {
            document.getElementById('status').innerText = 'Complete';
        });

        // Fetch project hash loop
        async function fetchHashLoop() {
            const status = document.getElementById('hash-status');
            status.innerText = 'Computing hash loop...';

            try {
                const response = await fetch('/project-hash');
                const data = await response.json();

                const hashDiv = document.getElementById('project-hash');
                hashDiv.innerHTML = Object.entries(data)
                    .map(([k, v]) => `${k}: ${v}`)
                    .join('\n');

                status.innerText = 'Hash loop computed';
            } catch (e) {
                status.innerText = 'Error: ' + e.message;
            }
        }

        // Initialize
        fetchHashLoop();
    </script>
</body>
</html>
